repos:
  # ── Python (backend) ───────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff
        files: ^backend/
        args: [--fix, --config, backend/pyproject.toml]
      - id: ruff-format
        files: ^backend/
        args: [--config, backend/pyproject.toml]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        files: ^backend/app/
        additional_dependencies: [pydantic>=2.6.0, sqlalchemy>=2.0.0, redis>=5.0.0]
        args: [--config-file, backend/pyproject.toml]

  # ── General ────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  # ── 项目自检门禁（AGENTS.md「完成前自检门禁」的 commit 级兜底）──
  - repo: local
    hooks:
      - id: self-review
        name: self-review (scripts/self_review.sh)
        entry: bash scripts/self_review.sh
        language: system
        pass_filenames: false
        always_run: true
      # ── 每次 commit 前自动跑：前端类型检查（仓库无 eslint/prettier，前端静态校验 = tsc，与 CI 一致）
      - id: frontend-typecheck
        name: frontend tsc --noEmit
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$
      # ── 每次 commit 前自动跑：后端非 e2e 单测（无 DB 依赖，~4s；排除 bench 基准）──
      - id: backend-test
        name: backend pytest (not e2e, not bench)
        entry: bash -c 'cd backend && uv run pytest -m "not e2e and not bench" -q --no-cov'
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
