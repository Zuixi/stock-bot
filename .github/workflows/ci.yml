name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────
  backend-lint:
    name: "Lint (backend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check app/ tests/
      - run: uv run ruff format --check app/ tests/

  backend-typecheck:
    name: "Type Check (backend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run mypy app/

  backend-test:
    name: "Test (backend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: stock_user
          POSTGRES_PASSWORD: stock_pass
          POSTGRES_DB: stock_bot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://stock_user:stock_pass@localhost:5432/stock_bot_test
      - run: uv run pytest tests/ -m "not e2e and not bench" -v --cov=app --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://stock_user:stock_pass@localhost:5432/stock_bot_test
          REDIS_URL: redis://localhost:6379/0
      - uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request'
        with:
          files: backend/coverage.xml
          flags: backend

  # ── Auth Service ─────────────────────────────────────────────
  auth-service-lint:
    name: "Lint (auth-service)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: auth-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  auth-service-typecheck:
    name: "Type Check (auth-service)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: auth-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run mypy app/

  auth-service-test:
    name: "Test (auth-service)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: auth-service } }
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_pass
          POSTGRES_DB: stock_bot_auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://auth_user:auth_pass@localhost:5432/stock_bot_auth_test
      - run: uv run pytest tests/ -v --cov=app --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://auth_user:auth_pass@localhost:5432/stock_bot_auth_test
          REDIS_URL: redis://localhost:6379/0
      - uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request'
        with:
          files: auth-service/coverage.xml
          flags: auth-service
  # ── CPU 基准硬门禁（Tier 1，见 plans/2026-09-09-benchmark-tiers.md）──
  # wall-clock 基线绑定硬件：不得用入库 baseline.json 跨机器对比（本机与
  # runner 差 30-50%）。这里做同 runner A/B：先跑 base commit 存临时基线，
  # 再跑 head 对比；新增基准经 --allow-added 放行（base 侧本就没有）。
  bench-cpu:
    name: "Bench CPU (Tier1 hard gate)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - name: Resolve base commit
        id: base
        run: |
          # pull_request：与 origin/main 最新比（PR 的 base.sha 是创建时点，可能
          # 落后于 main 且缺新脚本——PR#4 曾因此 checkout 到无 bench.sh 的老 main）
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "SHA=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "SHA=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            # 单 commit 历史兜底：无 parent 时自比（恒绿，仅记录）
            echo "SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: A-side baseline (base commit, same runner)
        run: |
          git checkout "${{ steps.base.outputs.SHA }}"
          # bench 脚本随本 PR 引入/修改，base 树上可能没有或版本旧——从 head 取回
          # （pathspec 相对 cwd，故本步骤在仓库根执行）
          git checkout "${{ github.sha }}" -- scripts/bench.sh scripts/bench_compare.py
          (cd backend && uv sync --frozen --extra dev)
          BENCH_BASELINE="$RUNNER_TEMP/bench_ab.json" BENCH_CURRENT="$RUNNER_TEMP/bench_a.json" \
            bash scripts/bench.sh --save-baseline
      - name: B-side head + gate
        run: |
          git checkout "${{ github.sha }}"
          (cd backend && uv sync --frozen --extra dev)
          BENCH_BASELINE="$RUNNER_TEMP/bench_ab.json" \
            bash scripts/bench.sh --allow-added
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: benchmarks/last.json
          retention-days: 7

  # ── Frontend ─────────────────────────────────────────────────
  frontend-lint:
    name: "Lint (frontend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit

  frontend-build:
    name: "Build (frontend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  # ── 文档一致性（AGENTS.md「自检门禁」的 CI 兜底；信息性，不阻断合并）──
  docs-consistency:
    name: "Docs consistency (informational)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Compute base ref
        id: base
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "REF=${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "REF=${{ github.event.before }}"
          else
            echo "REF=$(git rev-list --max-parents=0 HEAD)"
          fi
        shell: bash
      - name: Whitespace / conflict markers (hard check)
        run: |
          BASE="${{ steps.base.outputs.REF }}"
          if git diff --check "$BASE"...HEAD; then
            echo "OK: 无空白/冲突标记错误"
          else
            echo "::error::PR/提交 diff 含空白或冲突标记错误"
            echo "::group::details"
            git diff --check "$BASE"...HEAD
            echo "::endgroup::"
            exit 1
          fi
        shell: bash
      - name: Docs-vs-Changelog heuristic (warning only)
        run: |
          BASE="${{ steps.base.outputs.REF }}"
          MD_CHANGED=$(git diff --name-only "$BASE"...HEAD | grep -E '\.md$' || true)
          if [ -n "$MD_CHANGED" ] && ! printf '%s\n' "$MD_CHANGED" | grep -q 'docs/Changelog.md'; then
            echo "::warning::变更涉及 .md 但未触及 docs/Changelog.md，请按 AGENTS 约定补记。变更："
            printf '%s\n' "$MD_CHANGED"
          else
            echo "OK: 无文档变更，或已包含 docs/Changelog.md"
          fi
        shell: bash

  # ── Integration ──────────────────────────────────────────────
  docker-smoke:
    name: "Docker Compose Smoke Test"
    runs-on: ubuntu-latest
    needs: [backend-test, auth-service-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare backend env (compose references gitignored .env)
        run: |
          cp backend/.env.example backend/.env
          cp .env.docker.example .env 2>/dev/null || true
      - name: Build and start services
        run: docker compose up -d --build --wait
      - name: Verify health via gateway (port 80)
        run: |
          # 验证前端首页
          curl -f http://localhost:80/ | head -1
          # 验证后端 API 接口连通性
          curl -f http://localhost:80/api/v1/exchanges
          # 验证 auth-service 接口连通性
          curl -f http://localhost:80/auth/health/live
          curl -f http://localhost:80/auth/csrf
          curl -f http://localhost:80/.well-known/jwks.json
      - name: Auth login closed-loop smoke (csrf -> register -> csrf -> login -> protected API)
        run: |
          # 匿名写操作（注册/登录）均需先 GET /auth/csrf 做 double-submit CSRF
          CSRF=$(curl -sf -c /tmp/jar -b /tmp/jar http://localhost/auth/csrf | python3 -c 'import sys,json;print(json.load(sys.stdin)["csrf_token"])')
          curl -sf -c /tmp/jar -b /tmp/jar -X POST http://localhost/auth/register -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d '{"username":"smokeuser","email":"smoke@example.com","password":"SmokePass123!","display_name":"Smoke"}'
          CSRF=$(curl -sf -c /tmp/jar -b /tmp/jar http://localhost/auth/csrf | python3 -c 'import sys,json;print(json.load(sys.stdin)["csrf_token"])')
          curl -sf -c /tmp/jar -b /tmp/jar -X POST http://localhost/auth/login -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d '{"username_or_email":"smokeuser","password":"SmokePass123!"}'
          curl -sf -b /tmp/jar http://localhost/api/v1/watchlists | head -c 200   # 必须登录态 200
          # 未登录必须 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/v1/watchlists)" = "401"
      - name: Teardown
        if: always()
        run: docker compose down -v
