name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────
  backend-lint:
    name: "Lint (backend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check app/ tests/
      - run: uv run ruff format --check app/ tests/

  backend-typecheck:
    name: "Type Check (backend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run mypy app/

  backend-test:
    name: "Test (backend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: stock_user
          POSTGRES_PASSWORD: stock_pass
          POSTGRES_DB: stock_bot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://stock_user:stock_pass@localhost:5432/stock_bot_test
      - run: uv run pytest tests/ -m "not e2e" -v --cov=app --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://stock_user:stock_pass@localhost:5432/stock_bot_test
          REDIS_URL: redis://localhost:6379/0
      - uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request'
        with:
          files: backend/coverage.xml
          flags: backend

  # ── Auth Service ─────────────────────────────────────────────
  auth-service-lint:
    name: "Lint (auth-service)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: auth-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  auth-service-typecheck:
    name: "Type Check (auth-service)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: auth-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run mypy app/

  auth-service-test:
    name: "Test (auth-service)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: auth-service } }
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_pass
          POSTGRES_DB: stock_bot_auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://auth_user:auth_pass@localhost:5432/stock_bot_auth_test
      - run: uv run pytest tests/ -v --cov=app --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://auth_user:auth_pass@localhost:5432/stock_bot_auth_test
          REDIS_URL: redis://localhost:6379/0
      - uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request'
        with:
          files: auth-service/coverage.xml
          flags: auth-service

  # ── Frontend ─────────────────────────────────────────────────
  frontend-lint:
    name: "Lint (frontend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit

  frontend-build:
    name: "Build (frontend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  # ── Integration ──────────────────────────────────────────────
  docker-smoke:
    name: "Docker Compose Smoke Test"
    runs-on: ubuntu-latest
    needs: [backend-test, auth-service-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare backend env (compose references gitignored .env)
        run: |
          cp backend/.env.example backend/.env
          cp .env.docker.example .env 2>/dev/null || true
      - name: Build and start services
        run: docker compose up -d --build --wait
      - name: Verify health via gateway (port 80)
        run: |
          # 验证前端首页
          curl -f http://localhost:80/ | head -1
          # 验证后端 API 接口连通性
          curl -f http://localhost:80/api/v1/exchanges
          # 验证 auth-service 接口连通性
          curl -f http://localhost:80/auth/health/live
          curl -f http://localhost:80/auth/csrf
          curl -f http://localhost:80/.well-known/jwks.json
      - name: Auth login closed-loop smoke (register -> csrf -> login -> protected API)
        run: |
          # 注册→CSRF→登录→受保护接口闭环
          curl -sf -c /tmp/jar -X POST http://localhost/auth/register -H 'Content-Type: application/json' -d '{"username":"smokeuser","email":"smoke@example.com","password":"SmokePass123!","display_name":"Smoke"}'
          CSRF=$(curl -sf -c /tmp/jar -b /tmp/jar http://localhost/auth/csrf | python3 -c 'import sys,json;print(json.load(sys.stdin)["csrf_token"])')
          curl -sf -c /tmp/jar -b /tmp/jar -X POST http://localhost/auth/login -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" -d '{"username_or_email":"smokeuser","password":"SmokePass123!"}'
          curl -sf -b /tmp/jar http://localhost/api/v1/watchlists | head -c 200   # 必须登录态 200
          # 未登录必须 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/v1/watchlists)" = "401"
      - name: Teardown
        if: always()
        run: docker compose down -v
