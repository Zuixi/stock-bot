name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────
  backend-lint:
    name: "Lint (backend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen
      - run: uv run ruff check app/ tests/
      - run: uv run ruff format --check app/ tests/

  backend-typecheck:
    name: "Type Check (backend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen
      - run: uv run mypy app/

  backend-test:
    name: "Test (backend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: stock_user
          POSTGRES_PASSWORD: stock_pass
          POSTGRES_DB: stock_bot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen
      - run: uv run alembic upgrade head
      - run: uv run pytest tests/ -v --cov=app --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://stock_user:stock_pass@localhost:5432/stock_bot_test
          REDIS_URL: redis://localhost:6379/0
      - uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request'
        with:
          files: backend/coverage.xml
          flags: backend

  # ── Frontend ─────────────────────────────────────────────────
  frontend-lint:
    name: "Lint (frontend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit

  frontend-build:
    name: "Build (frontend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  # ── Integration ──────────────────────────────────────────────
  docker-smoke:
    name: "Docker Compose Smoke Test"
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start services
        run: docker compose up -d --build --wait
      - name: Verify health
        run: |
          curl -f http://localhost:8000/health
          curl -f http://localhost:3000/ | head -1
      - name: Teardown
        if: always()
        run: docker compose down -v
