name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────
  backend-lint:
    name: "Lint (backend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check app/ tests/
      - run: uv run ruff format --check app/ tests/

  backend-typecheck:
    name: "Type Check (backend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run mypy app/

  backend-test:
    name: "Test (backend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: stock_user
          POSTGRES_PASSWORD: stock_pass
          POSTGRES_DB: stock_bot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://stock_user:stock_pass@localhost:5432/stock_bot_test
      - run: uv run pytest tests/ -m "not e2e and not bench" -v --cov=app --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://stock_user:stock_pass@localhost:5432/stock_bot_test
          REDIS_URL: redis://localhost:6379/0
      - uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request'
        with:
          files: backend/coverage.xml
          flags: backend

  # ── Auth Service ─────────────────────────────────────────────
  auth-service-lint:
    name: "Lint (auth-service)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: auth-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  auth-service-typecheck:
    name: "Type Check (auth-service)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: auth-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run mypy app/

  auth-service-test:
    name: "Test (auth-service)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: auth-service } }
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_pass
          POSTGRES_DB: stock_bot_auth_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - run: uv sync --frozen --extra dev
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://auth_user:auth_pass@localhost:5432/stock_bot_auth_test
      - run: uv run pytest tests/ -v --cov=app --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://auth_user:auth_pass@localhost:5432/stock_bot_auth_test
          REDIS_URL: redis://localhost:6379/0
      - uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request'
        with:
          files: auth-service/coverage.xml
          flags: auth-service
  # ── CPU 基准硬门禁（Tier 1，见 plans/2026-09-09-benchmark-tiers.md）──
  # wall-clock 基线绑定硬件：不得用入库 baseline.json 跨机器对比（本机与
  # runner 差 30-50%）。这里做同 runner A/B：先跑 base commit 存临时基线，
  # 再跑 head 对比；新增基准经 --allow-added 放行（base 侧本就没有）。
  bench-cpu:
    name: "Bench CPU (Tier1 hard gate)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
        with: { python-version: "3.13" }
      - name: Resolve base commit
        id: base
        run: |
          # pull_request：与 origin/main 最新比（PR 的 base.sha 是创建时点，可能
          # 落后于 main 且缺新脚本——PR#4 曾因此 checkout 到无 bench.sh 的老 main）
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "SHA=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "SHA=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            # 单 commit 历史兜底：无 parent 时自比（恒绿，仅记录）
            echo "SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: A-side baseline (base commit, same runner)
        run: |
          git checkout "${{ steps.base.outputs.SHA }}"
          # bench 脚本随本 PR 引入/修改，base 树上可能没有或版本旧——从 head 取回
          # （pathspec 相对 cwd，故本步骤在仓库根执行）
          git checkout "${{ github.sha }}" -- scripts/bench.sh scripts/bench_compare.py
          (cd backend && uv sync --frozen --extra dev)
          BENCH_BASELINE="$RUNNER_TEMP/bench_ab.json" BENCH_CURRENT="$RUNNER_TEMP/bench_a.json" \
            bash scripts/bench.sh --save-baseline
      - name: B-side head + gate
        run: |
          git checkout "${{ github.sha }}"
          (cd backend && uv sync --frozen --extra dev)
          BENCH_BASELINE="$RUNNER_TEMP/bench_ab.json" \
            bash scripts/bench.sh --allow-added
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: benchmarks/last.json
          retention-days: 7

  # ── Frontend ─────────────────────────────────────────────────
  frontend-lint:
    name: "Lint (frontend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      # 设计令牌硬门禁：涨跌色对比度（bg-page + bg-panel）≥ 4.5 + theme.ts↔theme.css 一致
      #                    + 组件引用的每个 var(--x) 必须真的被定义（Ruling 43）
      - run: npm run check:design
      # 路由迁移硬门禁：旧 15 条路由/redirect 目标逐字/保留非 redirect/目标非占位页/IA 文档↔代码一致
      - run: npm run check:routes
      - run: npx tsc --noEmit

  frontend-build:
    name: "Build (frontend)"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  # ── 文档一致性（空白/冲突 + doc_gate 阻断；Changelog 启发式仅告警）──
  docs-consistency:
    name: "Docs consistency"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Compute base ref
        id: base
        run: |
          # 必须写进 GITHUB_OUTPUT；只 echo 到 stdout 不会产生 steps.base.outputs.*，
          # 于是下游 `"$BASE"...HEAD` 变成 `...HEAD`，被 git 当 HEAD...HEAD 静默空 diff ——
          # 即「空白/冲突标记」「Changelog 启发式」「doc_gate 的 ADR 基准」三个步骤全部空转。
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "REF=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "REF=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          else
            echo "REF=$(git rev-list --max-parents=0 HEAD)" >> "$GITHUB_OUTPUT"
          fi
        shell: bash
      - name: Whitespace / conflict markers (hard check)
        run: |
          BASE="${{ steps.base.outputs.REF }}"
          if git diff --check "$BASE"...HEAD; then
            echo "OK: 无空白/冲突标记错误"
          else
            echo "::error::PR/提交 diff 含空白或冲突标记错误"
            echo "::group::details"
            git diff --check "$BASE"...HEAD
            echo "::endgroup::"
            exit 1
          fi
        shell: bash
      - name: Docs-vs-Changelog heuristic (warning only)
        run: |
          BASE="${{ steps.base.outputs.REF }}"
          MD_CHANGED=$(git diff --name-only "$BASE"...HEAD | grep -E '\.md$' || true)
          if [ -n "$MD_CHANGED" ] && ! printf '%s\n' "$MD_CHANGED" | grep -q 'docs/Changelog.md'; then
            echo "::warning::变更涉及 .md 但未触及 docs/Changelog.md，请按 AGENTS 约定补记。变更："
            printf '%s\n' "$MD_CHANGED"
          else
            echo "OK: 无文档变更，或已包含 docs/Changelog.md"
          fi
        shell: bash
      - name: Documentation gate (doc_gate.sh)
        # ADR「只增不改」需与 PR base 比：checkout 后工作区==HEAD，用 HEAD 比会恒为空。
        run: DOC_GATE_ADR_BASE="${{ steps.base.outputs.REF }}" bash scripts/doc_gate.sh

  # ── Integration ──────────────────────────────────────────────
  docker-smoke:
    name: "Docker Compose Smoke Test"
    runs-on: ubuntu-latest
    needs: [backend-test, auth-service-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare backend env (compose references gitignored .env)
        run: |
          cp backend/.env.example backend/.env
          cp .env.docker.example .env 2>/dev/null || true
      - name: Build and start services
        run: docker compose up -d --build --wait
      - name: Diagnose gateway routing (always)
        # 网关只把 :80 映射到宿主机（dashboard :8080 仅内网），所以路由表只能在容器内取。
        # 本步骤无条件跑：一旦下面的健康检查失败，这几行就是唯一的根因证据——
        # 「容器全 Healthy 但一切路径都返回 Traefik 自己的 404（body 恰为 19 字节
        # '404 page not found'）」只可能是 Docker provider 没把 labels 变成 router，
        # 而 provider 失败的原因（API 版本协商 / socket 不可达）只出现在 Traefik 日志里。
        run: |
          echo '=== docker version ==='
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}} api={{.Server.APIVersion}} minapi={{.Server.MinAPIVersion}}' || true
          echo '=== traefik image tag ==='
          docker inspect gateway --format '{{.Config.Image}}' || true
          echo '=== compose ps ==='
          docker compose ps || true
          echo '=== traefik providers (routers/services as loaded) ==='
          docker compose exec -T gateway sh -c \
            'wget -qO- http://127.0.0.1:8080/api/rawdata' 2>/dev/null | head -c 3000 || echo '(rawdata unavailable)'
          echo
          echo '=== gateway logs (last 120) ==='
          docker compose logs gateway --tail=120 --no-log-prefix || true
      - name: Verify health via gateway (port 80)
        # 条件式轮询而非固定 sleep：`up --wait` 只保证容器健康，不保证 Traefik 已把
        # Docker labels 变成 router（provider 有自身的事件订阅节奏）。先打一次现场，
        # 再按条件重试到阈值，失败时把最后一次的响应体一起打出来。
        run: |
          wait_for() {
            local url="$1" desc="$2" tries=30 code body
            for i in $(seq 1 "$tries"); do
              body=$(curl -s -o /tmp/body -w '%{http_code}' "$url" || echo 000)
              code="$body"
              if [ "$code" = "200" ]; then
                [ "$i" -gt 1 ] && echo "  ✓ $desc 在第 $i 次尝试就绪（$url）"
                return 0
              fi
              [ "$i" = 1 ] && echo "  首次尝试 $desc（$url）→ HTTP $code，响应体：$(head -c 200 /tmp/body)"
              sleep 2
            done
            echo "  ✗ $desc（$url）连续 $tries 次未就绪，HTTP $code，响应体：$(head -c 200 /tmp/body)"
            return 1
          }
          # 验证前端首页 / 后端 API / auth-service 连通性
          wait_for http://localhost:80/ '前端首页'
          wait_for http://localhost:80/api/v1/exchanges '后端 API'
          wait_for http://localhost:80/health/live 'auth-service health'
          wait_for http://localhost:80/auth/csrf 'auth csrf'
          wait_for http://localhost:80/.well-known/jwks.json 'jwks'
      - name: "Auth closed-loop smoke (invite-only: register closed -> bootstrap admin -> provision -> temp password -> forced change -> protected API)"
        run: |
          # 邀请制（ADR 0010）：自助注册已关闭，账号只能由管理员开户或 bootstrap CLI 引导。
          ADMIN_INIT_PW='SmokeAdminInit123!'
          ADMIN_OWN_PW='SmokeAdminOwn123!'
          USER_INIT_PW='SmokeUserInit123!'

          csrf() { curl -sf -c /tmp/jar -b /tmp/jar http://localhost/auth/csrf \
                     | python3 -c 'import sys,json;print(json.load(sys.stdin)["csrf_token"])'; }

          # 1) 自助注册必须已关闭
          code=$(curl -s -o /tmp/reg.json -w '%{http_code}' -c /tmp/jar -b /tmp/jar \
                   -X POST http://localhost/auth/register -H 'Content-Type: application/json' \
                   -H "X-CSRF-Token: $(csrf)" \
                   -d '{"username":"smokeuser","email":"smoke@example.com","password":"SmokePass123!"}')
          if [ "$code" != "403" ]; then echo "✗ 注册应已关闭，实际 HTTP $code"; cat /tmp/reg.json; exit 1; fi
          grep -q AUTH_REGISTRATION_DISABLED /tmp/reg.json || { echo "✗ 缺少 AUTH_REGISTRATION_DISABLED"; cat /tmp/reg.json; exit 1; }

          # 2) 引导首个管理员（幂等；密码经 env 注入，绝不进 argv）
          docker compose run --rm -e ADMIN_BOOTSTRAP_PASSWORD="$ADMIN_INIT_PW" auth-service \
            python -m app.cli bootstrap-admin --username smokeadmin --email smokeadmin@example.com

          # 3) 管理员首登 → 强制改密
          curl -sf -c /tmp/jar -b /tmp/jar -X POST http://localhost/auth/login \
            -H 'Content-Type: application/json' -H "X-CSRF-Token: $(csrf)" \
            -d "{\"username_or_email\":\"smokeadmin\",\"password\":\"$ADMIN_INIT_PW\"}" > /tmp/login.json
          curl -sf -c /tmp/jar -b /tmp/jar -X POST http://localhost/auth/change-password \
            -H 'Content-Type: application/json' -H "X-CSRF-Token: $(csrf)" \
            -d "{\"current_password\":\"$ADMIN_INIT_PW\",\"new_password\":\"$ADMIN_OWN_PW\"}" > /dev/null

          # 4) 开户（roles 必填），一次性临时密码只在响应里出现一次
          curl -sf -c /tmp/jar -b /tmp/jar -X POST http://localhost/auth/admin/users \
            -H 'Content-Type: application/json' -H "X-CSRF-Token: $(csrf)" \
            -d '{"username":"smokeuser","email":"smoke@example.com","roles":["analyst"]}' > /tmp/prov.json
          TEMP_PW=$(python3 -c 'import json;print(json.load(open("/tmp/prov.json"))["initial_password"])')

          # 5) 新用户用临时密码登录 → /api 必须被「强制改密」门控挡住（403，而不是放行）
          rm -f /tmp/jar2
          csrf2() { curl -sf -c /tmp/jar2 -b /tmp/jar2 http://localhost/auth/csrf \
                      | python3 -c 'import sys,json;print(json.load(sys.stdin)["csrf_token"])'; }
          curl -sf -c /tmp/jar2 -b /tmp/jar2 -X POST http://localhost/auth/login \
            -H 'Content-Type: application/json' -H "X-CSRF-Token: $(csrf2)" \
            -d "{\"username_or_email\":\"smokeuser\",\"password\":\"$TEMP_PW\"}" > /dev/null
          code=$(curl -s -o /tmp/gated.json -w '%{http_code}' -b /tmp/jar2 http://localhost/api/v1/watchlists)
          if [ "$code" != "403" ]; then echo "✗ 临时密码会话访问 /api 应被门控，实际 HTTP $code"; cat /tmp/gated.json; exit 1; fi
          grep -q AUTH_PASSWORD_CHANGE_REQUIRED /tmp/gated.json || { echo "✗ 门控错误码不对"; cat /tmp/gated.json; exit 1; }

          # 6) 改密后门控解除（断言缓存只在成功时写入，故无需等待 TTL）
          curl -sf -c /tmp/jar2 -b /tmp/jar2 -X POST http://localhost/auth/change-password \
            -H 'Content-Type: application/json' -H "X-CSRF-Token: $(csrf2)" \
            -d "{\"current_password\":\"$TEMP_PW\",\"new_password\":\"$USER_INIT_PW\"}" > /dev/null
          curl -sf -b /tmp/jar2 http://localhost/api/v1/watchlists | head -c 200

          # 7) 未登录必须 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/v1/watchlists)" = "401"
      - name: Gateway logs on failure
        if: failure()
        run: docker compose logs gateway --tail=200 --no-log-prefix || true
      - name: Teardown
        if: always()
        run: docker compose down -v
