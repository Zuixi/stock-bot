# ==============================================================================
# Traefik v3 Static Configuration
# ==============================================================================

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
log:
  level: INFO
  format: json

accessLog:
  format: json
  bufferingSize: 100
  fields:
    headers:
      defaultMode: keep

# ------------------------------------------------------------------------------
# EntryPoints
# ------------------------------------------------------------------------------
entryPoints:
  web:
    address: ":80"
  traefik:
    address: ":8080"

# ------------------------------------------------------------------------------
# Providers
# ------------------------------------------------------------------------------
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    watch: true
  file:
    directory: "/etc/traefik/dynamic"
    watch: true

# ------------------------------------------------------------------------------
# API & Dashboard
# ------------------------------------------------------------------------------
api:
  dashboard: true
  insecure: true

# ------------------------------------------------------------------------------
# Metrics
# ------------------------------------------------------------------------------
metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    entryPoint: traefik
