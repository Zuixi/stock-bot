x-backend-build: &backend-build
  context: ./backend

services:

  # ---- infrastructure ----
  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/sclorg/postgresql-15-c9s:latest
    environment:
      POSTGRESQL_USER: stock_user
      POSTGRESQL_PASSWORD: stock_pass
      POSTGRESQL_DATABASE: stock_bot
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/pgsql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/opstree/redis:v7.0.5
    depends_on:
      redis-init:
        condition: service_completed_successfully
    container_name: redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-init:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/alpine:3.20
    user: "0:0"
    container_name: init_redis
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - redis_data:/data
    restart: "no"

  rabbitmq:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/rabbitmq:4.2.2-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    container_name: rabbitmq
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- one-shot migration ----
  migrate:
    image: stock-bot-backend:local
    build:
      <<: *backend-build
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://stock_user:stock_pass@postgres:5432/stock_bot
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    container_name: migrate
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # ---- backend api ----
  api:
    image: stock-bot-backend:local
    build:
      <<: *backend-build
    ports:
      - "8000:8000"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://stock_user:stock_pass@postgres:5432/stock_bot
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SW_DATA_DIR: /app/data/sw
    dns:
      - 8.8.8.8
      - 223.5.5.5
    container_name: backend_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./docs/references/sw/SwClass:/app/data/sw:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---- backend worker ----
  worker:
    image: stock-bot-backend:local
    build:
      <<: *backend-build
    env_file: ./backend/.env
    container_name: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://stock_user:stock_pass@postgres:5432/stock_bot
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    dns:
      - 8.8.8.8
      - 223.5.5.5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "app.workers.runner"]

  # ---- frontend ----
  frontend:
    build:
      context: ./frontend
      target: runtime
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
