x-backend-build: &backend-build
  context: ./backend

x-auth-build: &auth-build
  context: ./auth-service

services:

  # ---- api gateway ----
  gateway:
    # v3.6.2+：Docker Engine 29 将最低 API 提升至 1.44，Traefik ≤3.3 的 Docker
    # provider 协商到 v1.24 被 daemon 拒绝（空 "Error response from daemon"），
    # 容器 labels 路由全部无法加载。v3.6.x 已修复版本协商，勿降回旧版。
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/traefik:v3.6.2
    container_name: gateway
    restart: unless-stopped
    ports:
      - "80:80"
      # dashboard (8080) 不再映射宿主机：仅内网可达；
      # 需要访问时用 `docker exec` 或临时 `docker compose exec` 端口转发，勿长期对外暴露
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./gateway/dynamic:/etc/traefik/dynamic:ro
    depends_on:
      - frontend
      - api
      - auth-service
      - forward-auth
    healthcheck:
      # 断言 Docker provider 已把容器 labels 变成 router（而不只是“进程活着”）。
      # 没有这个健康检查时，`docker compose up --wait` 在网关容器刚 Running 时就返回，
      # 而 Traefik 还需一个节拍去订阅 Docker 事件、加载路由表；这段窗口内**所有**路径
      # （含 frontend 的 PathPrefix(`/`)）都返回 Traefik 自己的 404（body 恰 19 字节
      # '404 page not found'）——CI 的 docker-smoke 曾因此在首个 curl 上失败但被
      # `| head -1` 吞掉退出码，再由第二个 curl 以 exit 22 中断整个 job。
      # 断言 'frontend@docker' 存在 = 可路由，让 --wait 等真正的就绪条件。
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/rawdata | grep -q 'frontend@docker'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # ---- infrastructure: databases & brokers ----
  postgres:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/sclorg/postgresql-15-c9s:latest
    environment:
      POSTGRESQL_USER: stock_user
      POSTGRESQL_PASSWORD: stock_pass
      POSTGRESQL_DATABASE: stock_bot
    container_name: postgres
    restart: unless-stopped
    # 只绑回环：宿主机上的本地开发/pytest（localhost:5433）照常可用，
    # 外部网络访问不到。生产上若要彻底不绑，删掉这两行 ports 即可。
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/pgsql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  auth-db:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/sclorg/postgresql-15-c9s:latest
    environment:
      POSTGRESQL_USER: auth_user
      POSTGRESQL_PASSWORD: auth_pass
      POSTGRESQL_DATABASE: stock_bot_auth
    container_name: auth_db
    restart: unless-stopped
    volumes:
      - auth_postgres_data:/var/lib/pgsql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io/opstree/redis:v7.0.5
    depends_on:
      redis-init:
        condition: service_completed_successfully
    container_name: redis
    restart: unless-stopped
    # 只绑回环（理由同 postgres）；外部只应能访问 gateway 的 80/443
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-init:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/alpine:3.20
    user: "0:0"
    container_name: init_redis
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    volumes:
      - redis_data:/data
    restart: "no"

  rabbitmq:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/rabbitmq:4.2.2-management-alpine
    # AMQP 5672 / 管理 UI 15672 均不映射宿主机：仅 compose 内网使用；
    # 管理界面按需经 `docker exec rabbitmq rabbitmqctl` 或临时端口转发访问
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-stockbot}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-stockbot_pass}
    container_name: rabbitmq
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- one-shot migrations ----
  migrate:
    image: stock-bot-backend:local
    build:
      <<: *backend-build
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://stock_user:stock_pass@postgres:5432/stock_bot
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-stockbot}:${RABBITMQ_DEFAULT_PASS:-stockbot_pass}@rabbitmq:5672/
    container_name: migrate
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  migrate-auth:
    image: stock-bot-auth-service:local
    build:
      <<: *auth-build
    environment:
      DATABASE_URL: postgresql+asyncpg://auth_user:auth_pass@auth-db:5432/stock_bot_auth
      REDIS_URL: redis://redis:6379/0
    container_name: migrate_auth
    depends_on:
      auth-db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # ---- auth microservice ----
  auth-service:
    image: stock-bot-auth-service:local
    build:
      <<: *auth-build
    container_name: auth_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://auth_user:auth_pass@auth-db:5432/stock_bot_auth
      REDIS_URL: redis://redis:6379/0
      APP_ENV: ${APP_ENV:-development}
      # Principal Assertion JWT contract — must match backend AUTH_ISSUER/AUTH_AUDIENCE
      JWT_ISSUER: ${JWT_ISSUER:-stock-bot-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-urn:stock-bot:api}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      # JWT 密钥持久化：生产必填（AUTH_JWT_PRIVATE_KEY_PEM/AUTH_JWT_PUBLIC_KEY_PEM 同源密钥对）；
      # 留空则启动时自动生成 RSA 密钥对（重启轮换会导致已签发断言全部失效）
      JWT_PRIVATE_KEY_PEM: ${AUTH_JWT_PRIVATE_KEY_PEM:-}
      JWT_PUBLIC_KEY_PEM: ${AUTH_JWT_PUBLIC_KEY_PEM:-}
      # 生产必须 true（配合 HTTPS）；APP_ENV=production 时 auth-service 启动强校验
      COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # 仅当 auth-service 部署在可信反代（Traefik）之后时解析 X-Forwarded-For；
      # 直连/本地开发应设 false，避免客户端伪造该头污染审计 IP
      TRUST_FORWARDED_FOR: ${AUTH_TRUST_FORWARDED_FOR:-true}
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate-auth:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`) || PathPrefix(`/.well-known/jwks.json`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.routers.auth.priority=20"
      - "traefik.http.routers.auth.middlewares=sec-headers@file,auth-ratelimit@file"
      - "traefik.http.services.auth.loadbalancer.server.port=8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---- forward-auth sidecar (session -> assertion injection + CSRF enforcement) ----
  forward-auth:
    image: stock-bot-forward-auth:local
    build:
      context: ./forward-auth
    container_name: forward_auth
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      ASSERTION_CACHE_TTL: ${ASSERTION_CACHE_TTL:-25}
    depends_on:
      - auth-service
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:9000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---- backend api ----
  api:
    image: stock-bot-backend:local
    build:
      <<: *backend-build
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://stock_user:stock_pass@postgres:5432/stock_bot
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-stockbot}:${RABBITMQ_DEFAULT_PASS:-stockbot_pass}@rabbitmq:5672/
      SW_DATA_DIR: /app/data/sw
      # Principal Assertion verification contract — must match auth-service JWT_ISSUER/AUDIENCE
      AUTH_ISSUER: ${JWT_ISSUER:-stock-bot-auth}
      AUTH_AUDIENCE: ${JWT_AUDIENCE:-urn:stock-bot:api}
      AUTH_JWKS_URL: http://auth-service:8001/.well-known/jwks.json
    dns:
      - 8.8.8.8
      - 223.5.5.5
    container_name: backend_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./docs/references/sw/SwClass:/app/data/sw:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=10"
      - "traefik.http.routers.api.middlewares=strip-assertion@file,sec-headers@file,api-ratelimit@file,forward-auth@file"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
      - "traefik.http.routers.api-tasks.rule=PathPrefix(`/api/v1/tasks/fetch-`) || PathPrefix(`/api/v1/tasks/run-clustering`)"
      - "traefik.http.routers.api-tasks.entrypoints=web"
      - "traefik.http.routers.api-tasks.priority=30"
      - "traefik.http.routers.api-tasks.middlewares=strip-assertion@file,sec-headers@file,tasks-ratelimit@file,forward-auth@file"
      - "traefik.http.routers.api-tasks.service=api"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---- backend worker ----
  worker:
    image: stock-bot-backend:local
    build:
      <<: *backend-build
    env_file:
      - path: ./backend/.env
        required: false
    container_name: worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://stock_user:stock_pass@postgres:5432/stock_bot
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-stockbot}:${RABBITMQ_DEFAULT_PASS:-stockbot_pass}@rabbitmq:5672/
    dns:
      - 8.8.8.8
      - 223.5.5.5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "app.workers.runner"]

  # ---- scheduler (SSE index snapshot collection) ----
  scheduler:
    image: stock-bot-backend:local
    build:
      <<: *backend-build
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://stock_user:stock_pass@postgres:5432/stock_bot
      REDIS_URL: redis://redis:6379/0
    dns:
      - 8.8.8.8
      - 223.5.5.5
    container_name: scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.scheduler.runner"]

  # ---- frontend ----
  frontend:
    build:
      context: ./frontend
      target: runtime
    container_name: frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.middlewares=sec-headers@file"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

volumes:
  # 卷名显式锚定既有数据卷（原 wt_p7 部署所建）。部署源切换到 main 后，
  # 若去掉 name: 会按项目前缀新建一套空卷，行情/情绪历史数据将"消失"。
  postgres_data:
    name: stock_bot_wt_p7_postgres_data
  auth_postgres_data:
    name: stock_bot_wt_p7_auth_postgres_data
  redis_data:
    name: stock_bot_wt_p7_redis_data
  rabbitmq_data:
    name: stock_bot_wt_p7_rabbitmq_data
